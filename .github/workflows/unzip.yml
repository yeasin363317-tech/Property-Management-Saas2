name: Unzip project

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Zip file name in repo root"
        required: true
        default: "pms.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check zip exists
        run: |
          if [ ! -f "${{ github.event.inputs.zip_name }}" ]; then
            echo "Zip file not found in repo root"; exit 1
          fi

      - name: Unzip into repo root
        run: |
          unzip -o "${{ github.event.inputs.zip_name }}" -x "__MACOSX/*" "*/node_modules/*"
          rm "${{ github.event.inputs.zip_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip project files"
          git push
